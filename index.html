<script>
var cv = document.getElementById("g");

cv.width = window.innerWidth;
cv.height = window.innerHeight;
c.fillStyle = "#3a7a22";
c.fillRect(0, 0, cv.width, cv.height);
c.fillStyle = "#fff";
c.font = "bold 30px Arial, sans-serif";
c.textAlign = "center";
c.fillText("Loading...", cv.width/2, cv.height/2);

  c.fillStyle = "#fff";

var W = cv.width, H = cv.height;
function rez() { W = cv.width = window.innerWidth; H = cv.height = window.innerHeight; }

// --- CONSTANTS ---
var DURATION = 90, MAX_AMMO = 6, RELOAD_T = 1.3, MAX_COMBO = 5;
var MG_AMMO = 50, MG_RELOAD_T = 2.8, MG_FIRE_RATE = 0.08, MAX_HEAT = 100, HEAT_PER_SHOT = 3.5, HEAT_COOL_RATE = 18, OVERHEAT_PENALTY = 3.0;
var SNIPER_AMMO = 5, SNIPER_RELOAD_T = 3.5;
var MSL_AMMO = 3, MSL_RELOAD_T = 4.0;
var WEAPONS = ["shotgun","mg","sniper","missile"];
var WPN_AMMO = {shotgun:MAX_AMMO,mg:MG_AMMO,sniper:SNIPER_AMMO,missile:MSL_AMMO};
var WPN_RELOAD = {shotgun:RELOAD_T,mg:MG_RELOAD_T,sniper:SNIPER_RELOAD_T,missile:MSL_RELOAD_T};

// --- STATE ---
var state = "MENU", score = 0, timeLeft = DURATION, ammo = MAX_AMMO;
var reloading = false, reloadTimer = 0, combo = 0, bestCombo = 0;
var shotsFired = 0, birdsHit = 0, totalBirds = 0;
var mx = W/2, my = H/2, chScale = 1;
var shake = 0, shX = 0, shY = 0, flash = 0;
var bgOff = 0, spawnT = 0, spawnI = 1.8;
var menuT = 0, goTimer = 0, finalDisp = 0;
var birds = [], parts = [], pops = [], clouds = [], flashes = [];
var trees = [];
var audioCtx = null;

// --- WEAPON STATE ---
var weapon = 0; // 0=shotgun 1=mg 2=sniper 3=missile
var mDown = false;
var fireTimer = 0;
var heat = 0;
var overheated = false;
var overheatTimer = 0;
var mgShakeAccum = 0;
var shellCasings = [];
var sniperZoom = 0; // 0..1 zoom factor
var missiles = []; // active homing missiles
var missileSide = 0; // alternates 0=right, 1=left

// --- WEATHER STATE ---
var weather="clear",weatherT=15,rainDrops=[],rainbow=0,rainIntensity=0;

// --- TIME OF DAY STATE ---
var timeOfDay=0; // 0=dawn, 0.5=noon, 1.0=sunset

// --- AUDIO ---
function aud() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
function sndShot() {
  try {
    var x = aud(), d = 0.12, b = x.createBuffer(1, x.sampleRate*d|0, x.sampleRate);
    var a = b.getChannelData(0);
    for (var i=0;i<a.length;i++) a[i]=(Math.random()*2-1)*Math.pow(1-i/a.length,4);
    var s=x.createBufferSource(); s.buffer=b;
    var f=x.createBiquadFilter(); f.type="bandpass"; f.frequency.value=2500; f.Q.value=0.8;
    var g=x.createGain(); g.gain.value=0.3;
    s.connect(f); f.connect(g); g.connect(x.destination); s.start();
  } catch(e){}
}
function sndMG() {
  try {
    var x = aud(), d = 0.04, b = x.createBuffer(1, x.sampleRate*d|0, x.sampleRate);
    var a = b.getChannelData(0);
    for (var i=0;i<a.length;i++) a[i]=(Math.random()*2-1)*Math.pow(1-i/a.length,6);
    var s=x.createBufferSource(); s.buffer=b;
    var f=x.createBiquadFilter(); f.type="highpass"; f.frequency.value=3000; f.Q.value=1.2;
    var g=x.createGain(); g.gain.value=0.18;
    s.connect(f); f.connect(g); g.connect(x.destination); s.start();
  } catch(e){}
}
function sndOverheat() {
  try {
    var x=aud(), t=x.currentTime;
    var o=x.createOscillator(), g=x.createGain();
    o.type="sawtooth"; o.frequency.setValueAtTime(200,t);
    o.frequency.exponentialRampToValueAtTime(80,t+0.5);
    g.gain.setValueAtTime(0.12,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.5);
    o.connect(g); g.connect(x.destination); o.start(t); o.stop(t+0.55);
  } catch(e){}
}
function sndHit() {
  try {
    var x=aud(), t=x.currentTime;
    var o=x.createOscillator(), g=x.createGain();
    o.type="sawtooth"; o.frequency.setValueAtTime(900,t);
    o.frequency.exponentialRampToValueAtTime(150,t+0.18);
    g.gain.setValueAtTime(0.15,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.2);
    o.connect(g); g.connect(x.destination); o.start(t); o.stop(t+0.22);
  } catch(e){}
}
function sndReload() {
  try {
    var x=aud(), t=x.currentTime;
    var o=x.createOscillator(), g=x.createGain();
    o.type="square"; o.frequency.setValueAtTime(200,t);
    o.frequency.setValueAtTime(400,t+0.05);
    g.gain.setValueAtTime(0.08,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.1);
    o.connect(g); g.connect(x.destination); o.start(t); o.stop(t+0.12);
  } catch(e){}
}
function sndEmpty() {
  try {
    var x=aud(), t=x.currentTime;
    var o=x.createOscillator(), g=x.createGain();
    o.type="sine"; o.frequency.value=120;
    g.gain.setValueAtTime(0.06,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.06);
    o.connect(g); g.connect(x.destination); o.start(t); o.stop(t+0.08);
  } catch(e){}
}
function sndToggle() {
  try {
    var x=aud(), t=x.currentTime;
    var o=x.createOscillator(), g=x.createGain();
    o.type="sine"; o.frequency.setValueAtTime(600,t);
    o.frequency.setValueAtTime(900,t+0.06);
    g.gain.setValueAtTime(0.1,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.12);
    o.connect(g); g.connect(x.destination); o.start(t); o.stop(t+0.15);
  } catch(e){}
}
function sndExplosion(){
  try{
    var x=aud(),t=x.currentTime;
    // Noise burst
    var d=0.6,b=x.createBuffer(1,x.sampleRate*d|0,x.sampleRate);
    var a=b.getChannelData(0);
    for(var i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*Math.pow(1-i/a.length,2);
    var s=x.createBufferSource();s.buffer=b;
    var f=x.createBiquadFilter();f.type="lowpass";f.frequency.setValueAtTime(800,t);f.frequency.exponentialRampToValueAtTime(60,t+0.5);
    var g=x.createGain();g.gain.setValueAtTime(0.5,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.6);
    s.connect(f);f.connect(g);g.connect(x.destination);s.start(t);
    // Low rumble
    var o=x.createOscillator(),g2=x.createGain();
    o.type="sine";o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(30,t+0.5);
    g2.gain.setValueAtTime(0.3,t);g2.gain.exponentialRampToValueAtTime(0.001,t+0.5);
    o.connect(g2);g2.connect(x.destination);o.start(t);o.stop(t+0.55);
  }catch(e){}
}
function sndSniper(){
  try{
    var x=aud(),t=x.currentTime;
    var d=0.2,b=x.createBuffer(1,x.sampleRate*d|0,x.sampleRate);
    var a=b.getChannelData(0);
    for(var i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*Math.pow(1-i/a.length,3);
    var s=x.createBufferSource();s.buffer=b;
    var f=x.createBiquadFilter();f.type="bandpass";f.frequency.value=1800;f.Q.value=0.5;
    var g=x.createGain();g.gain.setValueAtTime(0.5,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.2);
    s.connect(f);f.connect(g);g.connect(x.destination);s.start(t);
    var o=x.createOscillator(),g2=x.createGain();
    o.type="sine";o.frequency.setValueAtTime(400,t);o.frequency.exponentialRampToValueAtTime(80,t+0.15);
    g2.gain.setValueAtTime(0.2,t);g2.gain.exponentialRampToValueAtTime(0.001,t+0.15);
    o.connect(g2);g2.connect(x.destination);o.start(t);o.stop(t+0.2);
  }catch(e){}
}
function sndMissile(){
  try{
    var x=aud(),t=x.currentTime;
    var o=x.createOscillator(),g=x.createGain();
    o.type="sawtooth";o.frequency.setValueAtTime(300,t);o.frequency.exponentialRampToValueAtTime(600,t+0.3);
    g.gain.setValueAtTime(0.15,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.3);
    var f=x.createBiquadFilter();f.type="lowpass";f.frequency.value=2000;
    o.connect(f);f.connect(g);g.connect(x.destination);o.start(t);o.stop(t+0.35);
  }catch(e){}
}
function sndLock(){
  try{
    var x=aud(),t=x.currentTime;
    var o=x.createOscillator(),g=x.createGain();
    o.type="square";o.frequency.setValueAtTime(800,t);o.frequency.setValueAtTime(1200,t+0.05);
    g.gain.setValueAtTime(0.1,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.1);
    o.connect(g);g.connect(x.destination);o.start(t);o.stop(t+0.12);
  }catch(e){}
}

// --- CLOUD ---
function mkCloud() {
  return { x:Math.random()*(W+400)-200, y:Math.random()*H*0.3+20, w:80+Math.random()*140, h:30+Math.random()*30, sp:8+Math.random()*15, a:0.4+Math.random()*0.4 };
}
function initClouds() { clouds=[]; for(var i=0;i<8;i++) clouds.push(mkCloud()); }
function updCloud(cl, dt) { cl.x-=cl.sp*dt; if(cl.x<-cl.w-50){cl.x=W+cl.w+Math.random()*200;cl.y=Math.random()*H*0.3+20;} }
function drwCloud(cl) {
  c.save();c.globalAlpha=cl.a;c.fillStyle="#FFF";
  c.beginPath();c.ellipse(cl.x,cl.y,cl.w*0.5,cl.h*0.5,0,0,Math.PI*2);c.fill();
  c.beginPath();c.ellipse(cl.x-cl.w*0.25,cl.y+5,cl.w*0.35,cl.h*0.4,0,0,Math.PI*2);c.fill();
  c.beginPath();c.ellipse(cl.x+cl.w*0.25,cl.y+3,cl.w*0.3,cl.h*0.38,0,0,Math.PI*2);c.fill();
  c.restore();
}
initClouds();

// --- TREES ---
function genTrees() {
  trees=[];
  var n=Math.floor(W/90)+4;
  for(var i=0;i<n;i++) trees.push({x:i*(W/n)+Math.random()*60-30,sz:0.7+Math.random()*0.8,ly:Math.random()<0.5?0:1,sh:Math.random()*0.3});
}
genTrees();
window.addEventListener("resize", function(){ rez(); genTrees(); });

// --- PARTICLE ---
function mkPart(x,y,type,col) {
  var p={x:x,y:y,type:type,life:1,col:col||"#FFF",vx:0,vy:0,grav:0,sz:4,dec:2,rot:0,rs:0};
  if(type==="feather"){p.vx=(Math.random()-0.5)*200;p.vy=-Math.random()*180-40;p.grav=250;p.sz=3+Math.random()*4;p.dec=1.2+Math.random()*0.5;p.rot=Math.random()*6.28;p.rs=(Math.random()-0.5)*8;}
  else if(type==="smoke"){p.vx=(Math.random()-0.5)*60;p.vy=-Math.random()*40-10;p.grav=-20;p.sz=6+Math.random()*8;p.dec=2.5;}
  else if(type==="spark"){p.vx=(Math.random()-0.5)*300;p.vy=(Math.random()-0.5)*300;p.grav=200;p.sz=1.5+Math.random()*2;p.dec=2;}
  else if(type==="casing"){p.vx=40+Math.random()*80;p.vy=-80-Math.random()*60;p.grav=400;p.sz=2.5;p.dec=1.5;p.rot=Math.random()*6.28;p.rs=(Math.random()-0.5)*15;}
  else if(type==="tracer"){p.vx=0;p.vy=0;p.grav=0;p.sz=3;p.dec=12;}
  return p;
}
function updPart(p,dt){p.vy+=p.grav*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=p.dec*dt;if(p.type==="feather"||p.type==="casing")p.rot+=p.rs*dt;}
function drwPart(p){
  if(p.life<=0)return;
  c.save();c.globalAlpha=Math.max(0,p.life);c.translate(p.x,p.y);
  if(p.type==="feather"){c.rotate(p.rot);c.fillStyle=p.col;c.beginPath();c.ellipse(0,0,p.sz,p.sz*0.35,0,0,Math.PI*2);c.fill();}
  else if(p.type==="smoke"){c.fillStyle=p.col;c.beginPath();c.arc(0,0,p.sz*(1+(1-p.life)*0.5),0,Math.PI*2);c.fill();}
  else if(p.type==="spark"){c.fillStyle=p.col;c.beginPath();c.arc(0,0,p.sz*p.life,0,Math.PI*2);c.fill();}
  else if(p.type==="casing"){c.rotate(p.rot);c.fillStyle="#D4A030";c.fillRect(-p.sz,-p.sz*2,p.sz*2,p.sz*4);c.fillStyle="#B8860B";c.fillRect(-p.sz,-p.sz*2,p.sz*2,p.sz);}
  else if(p.type==="tracer"){c.fillStyle=p.col;c.beginPath();c.arc(0,0,p.sz*p.life,0,Math.PI*2);c.fill();}
  c.restore();
}

// --- POPUP ---
function mkPop(x,y,txt,col){return{x:x,y:y,txt:txt,col:col||"#FFD700",life:1,vy:-80};}
function updPop(p,dt){p.y+=p.vy*dt;p.vy*=0.97;p.life-=dt*0.8;}
function drwPop(p){
  if(p.life<=0)return;
  c.save();c.globalAlpha=Math.max(0,p.life);
  c.font="bold "+(24+(1-p.life)*8)+"px Arial, sans-serif";c.textAlign="center";
  c.fillStyle="#000";c.fillText(p.txt,p.x+2,p.y+2);
  c.fillStyle=p.col;c.fillText(p.txt,p.x,p.y);
  c.restore();
}

// --- MUZZLE FLASH ---
function mkFlash(x,y,big){return{x:x,y:y,life:1,sz:big?22:15};}
function updFlash(f,dt){f.life-=dt*(f.sz>18?6:8);}
function drwFlash(f){
  if(f.life<=0)return;
  c.save();c.globalAlpha=f.life*0.7;
  var r=Math.max(1,f.sz*(2-f.life));
  var g=c.createRadialGradient(f.x,f.y,0,f.x,f.y,r);
  g.addColorStop(0,"#FFFAE0");g.addColorStop(0.3,"#FFA500");g.addColorStop(1,"rgba(255,100,0,0)");
  c.fillStyle=g;c.beginPath();c.arc(f.x,f.y,r,0,Math.PI*2);c.fill();
  // MG tracers get extra streak
  if(f.sz>18){
    c.strokeStyle="rgba(255,200,50,"+f.life*0.4+")";c.lineWidth=2;
    c.beginPath();c.moveTo(f.x,f.y);c.lineTo(f.x-20,f.y+10);c.stroke();
  }
  c.restore();
}

// --- BIRD TYPES ---
var TYPES = {
  normal:{sp:[100,180],sc:1,pt:10,col:{body:"#8B6914",belly:"#D4A853",wing:"#6B4F12"}},
  fast:{sp:[200,320],sc:0.8,pt:25,col:{body:"#5A5A5A",belly:"#8A8A8A",wing:"#3A3A3A"}},
  golden:{sp:[140,240],sc:1.1,pt:50,col:{body:"#FFD700",belly:"#FFEC8B",wing:"#DAA520"}},
  big:{sp:[70,130],sc:1.5,pt:15,col:{body:"#A0522D",belly:"#DEB887",wing:"#7B3F1B"}}
};

// --- BIRD ---
function mkBird(type, dir) {
  var cfg=TYPES[type], groundY=H*0.72;
  var b={
    type:type,dir:dir,st:"FLY",sc:cfg.sc,pt:cfg.pt,col:cfg.col,
    x:dir===1?-50:W+50, y:groundY-40-Math.random()*(groundY-120),
    vx:(cfg.sp[0]+Math.random()*(cfg.sp[1]-cfg.sp[0]))*dir, vy:0,
    pat:Math.random()<0.4?"sine":(Math.random()<0.5?"straight":"wave"),
    baseY:0,phase:Math.random()*6.28,amp:30+Math.random()*50,freq:1.5+Math.random()*2,
    wPh:Math.random()*6.28,wSpd:10+Math.random()*4,
    rot:0,rSpd:0,dvx:0,dvy:0,spkT:0,
    hRx:24*cfg.sc,hRy:17*cfg.sc
  };
  b.baseY=b.y;
  return b;
}
function updBird(b,dt){
  if(b.st==="FLY"){
    b.x+=b.vx*dt;b.wPh+=b.wSpd*dt;b.phase+=b.freq*dt;
    if(b.pat==="sine")b.y=b.baseY+Math.sin(b.phase)*b.amp;
    else if(b.pat==="wave"){b.y=b.baseY+Math.sin(b.phase)*b.amp*0.5;b.vx+=Math.cos(b.phase*1.7)*30*dt;}
    if(b.dir===1&&b.x>W+80)b.st="GONE";
    if(b.dir===-1&&b.x<-80)b.st="GONE";
    if(b.type==="golden"){b.spkT+=dt;if(b.spkT>0.1){b.spkT=0;parts.push(mkPart(b.x+(Math.random()-0.5)*30,b.y+(Math.random()-0.5)*20,"spark","#FFD700"));}}
  } else if(b.st==="HIT"){
    b.dvy+=500*dt;b.x+=b.dvx*dt;b.y+=b.dvy*dt;b.rot+=b.rSpd*dt;
    if(b.y>H+100)b.st="GONE";
  }
}
function drwBird(b){
  if(b.st==="GONE")return;
  c.save();c.translate(b.x,b.y);
  if(b.st==="FLY"){c.save();c.globalAlpha=0.15;c.fillStyle="#000";c.beginPath();c.ellipse(0,H*0.72-b.y+40,20*b.sc,5*b.sc,0,0,Math.PI*2);c.fill();c.restore();}
  if(b.st==="HIT")c.rotate(b.rot);
  var s=b.sc,d=b.dir;c.scale(d,1);
  var wy=Math.sin(b.wPh)*10*s;
  c.fillStyle=b.col.wing;
  c.beginPath();c.moveTo(-18*s,-3*s);c.quadraticCurveTo(-36*s,-22*s,-28*s,-30*s);c.quadraticCurveTo(-24*s,-14*s,-20*s,-8*s);c.fill();
  c.beginPath();c.moveTo(-18*s,0);c.quadraticCurveTo(-40*s,-12*s,-34*s,-20*s);c.quadraticCurveTo(-28*s,-6*s,-20*s,-2*s);c.fill();
  c.fillStyle=b.col.body;c.beginPath();c.ellipse(0,0,26*s,19*s,0,0,Math.PI*2);c.fill();
  c.fillStyle=b.col.belly;c.beginPath();c.ellipse(4*s,5*s,17*s,13*s,0.1,0,Math.PI*2);c.fill();
  c.fillStyle=b.col.wing;c.save();c.translate(-4*s,-4*s);c.rotate(Math.sin(b.wPh)*0.4);c.beginPath();c.ellipse(0,wy*0.3,17*s,9*s,-0.2,0,Math.PI*2);c.fill();c.restore();
  c.fillStyle=b.col.body;c.beginPath();c.arc(21*s,-16*s,11*s,0,Math.PI*2);c.fill();
  c.fillStyle="#D4380D";
  c.beginPath();c.arc(17*s,-27*s,3.5*s,0,Math.PI*2);c.fill();
  c.beginPath();c.arc(21*s,-29*s,3.5*s,0,Math.PI*2);c.fill();
  c.beginPath();c.arc(25*s,-27*s,3.5*s,0,Math.PI*2);c.fill();
  c.fillStyle="#D4380D";c.beginPath();c.ellipse(26*s,-6*s,3*s,4*s,0,0,Math.PI*2);c.fill();
  c.fillStyle="#F5A623";c.beginPath();c.moveTo(30*s,-17*s);c.lineTo(40*s,-14*s);c.lineTo(30*s,-11*s);c.closePath();c.fill();
  if(b.st==="HIT"){
    c.strokeStyle="#000";c.lineWidth=2*s;c.lineCap="round";
    c.beginPath();c.moveTo(22*s,-19*s);c.lineTo(26*s,-15*s);c.stroke();
    c.beginPath();c.moveTo(26*s,-19*s);c.lineTo(22*s,-15*s);c.stroke();
  } else {
    c.fillStyle="#FFF";c.beginPath();c.arc(24*s,-17*s,3.5*s,0,Math.PI*2);c.fill();
    c.fillStyle="#000";c.beginPath();c.arc(25*s,-17*s,2.2*s,0,Math.PI*2);c.fill();
    c.fillStyle="#FFF";c.beginPath();c.arc(25.8*s,-18*s,0.9*s,0,Math.PI*2);c.fill();
  }
  if(b.st==="FLY"){
    c.strokeStyle="#E8751A";c.lineWidth=2.2*s;c.lineCap="round";
    var lk=Math.sin(b.wPh*0.5)*3;

function drwUFO(u){
  if(u.st==="GONE")return;

    // saucer body
    c.fillStyle="#888";c.beginPath();c.ellipse(0,0,30*s,10*s,0,0,Math.PI*2);c.fill();
    c.fillStyle="#AAA";c.beginPath();c.ellipse(0,-2*s,22*s,7*s,0,0,Math.PI*2);c.fill();

    c.fillStyle="rgba(150,220,255,0.7)";c.beginPath();c.ellipse(0,-4*s,14*s,10*s,0,Math.PI,0);c.fill();
    c.fillStyle="rgba(200,240,255,0.4)";c.beginPath();c.ellipse(-3*s,-6*s,6*s,4*s,0,Math.PI,0);c.fill();
    // blinking lights
    for(var i=0;i<5;i++){
      var lx=-22*s+i*11*s,ly=3*s;

      if(on){c.save();c.globalAlpha=0.5;c.fillStyle="#FF6666";c.beginPath();c.arc(lx,ly,5*s,0,Math.PI*2);c.fill();c.restore();}
    }
    // shadow
    c.save();c.globalAlpha=0.15;c.fillStyle="#000";c.beginPath();c.ellipse(0,50*s,24*s,5*s,0,0,Math.PI*2);c.fill();c.restore();
  } else if(u.st==="EXPLODING"){
    var t=u.exT/u.exDur;
    var a=Math.max(0,1-t);

    var r=u.exT*50*u.sc;
    c.save();c.globalAlpha=a;
    var g=c.createRadialGradient(0,0,0,0,0,r);
    g.addColorStop(0,"#FFFFCC");g.addColorStop(0.15,"#FFEE44");g.addColorStop(0.35,"#FF8800");g.addColorStop(0.6,"#FF3300");g.addColorStop(1,"rgba(200,40,0,0)");
    c.fillStyle=g;c.beginPath();c.arc(0,0,r,0,Math.PI*2);c.fill();

    c.fillStyle=g2;c.beginPath();c.arc(0,0,r*0.4,0,Math.PI*2);c.fill();
    c.restore();

    if(t<0.5){

      c.strokeStyle="#FFAA44";c.lineWidth=4;
      c.beginPath();c.arc(0,0,r*1.2,0,Math.PI*2);c.stroke();

// --- MISSILE (homing) ---
function mkMissile(x,y){
  return{x:x,y:y,vx:0,vy:-200,life:5,target:null,trailT:0,sc:1};
}
function findNearestTarget(x,y){
  var best=null,bd=1e9;
  for(var i=0;i<birds.length;i++){
    if(birds[i].st!=="FLY")continue;
    var d=(birds[i].x-x)*(birds[i].x-x)+(birds[i].y-y)*(birds[i].y-y);
    if(d<bd){bd=d;best=birds[i];}
  }
  for(var i=0;i<ufos.length;i++){
    if(ufos[i].st!=="FLY")continue;
    var d=(ufos[i].x-x)*(ufos[i].x-x)+(ufos[i].y-y)*(ufos[i].y-y);
    if(d<bd){bd=d;best=ufos[i];}
  }
  for(var i=0;i<popChicks.length;i++){
    if(popChicks[i].st!=="UP"&&popChicks[i].st!=="WAIT")continue;
    var d=(popChicks[i].x-x)*(popChicks[i].x-x)+(popChicks[i].y-y)*(popChicks[i].y-y);
    if(d<bd){bd=d;best=popChicks[i];}
  }
  return best;
}
function updMissile(m,dt){
  m.life-=dt;
  // Find target if none or lost
  if(!m.target||m.target.st==="GONE"||m.target.st==="HIT"||m.target.st==="DOWN"||m.target.st==="EXPLODING")
    m.target=findNearestTarget(m.x,m.y);
  // Steer toward target
  if(m.target){
    var dx=m.target.x-m.x,dy=m.target.y-m.y,d=Math.sqrt(dx*dx+dy*dy)||1;
    var spd=400;
    var tvx=dx/d*spd,tvy=dy/d*spd;
    m.vx+=(tvx-m.vx)*3*dt;m.vy+=(tvy-m.vy)*3*dt;
  } else {
    m.vy+=200*dt; // fall if no target
  }
  m.x+=m.vx*dt;m.y+=m.vy*dt;
  // Trail
  m.trailT+=dt;
  if(m.trailT>0.02){m.trailT=0;parts.push(mkPart(m.x,m.y,"smoke","rgba(200,200,200,0.5)"));}
  // Hit detection
  if(m.target){
    var tx=m.target.x,ty=m.target.y;
    var ddx=tx-m.x,ddy=ty-m.y,dd=ddx*ddx+ddy*ddy;
    if(dd<900){
      // Bird hit
      if(m.target.st==="FLY"&&m.target.hRx!==undefined&&m.target.col!==undefined&&m.target.vx!==undefined&&m.target.type!==undefined){
        killBird(m.target);birdsHit++;score+=m.target.pt;sndHit();
        pops.push(mkPop(m.target.x,m.target.y-30,"+"+m.target.pt,"#FF66AA"));
        sndExplosion();shake=10;flash=0.2;
        for(var i=0;i<15;i++)parts.push(mkPart(m.x,m.y,"spark","#FF4400"));
        m.life=0;
      } else if(m.target.st==="FLY"&&m.target.blinkT!==undefined){
        // UFO hit
        killUFO(m.target);birdsHit++;score+=m.target.pt;
        pops.push(mkPop(m.target.x,m.target.y-40,"+"+m.target.pt,"#00FFAA"));
        m.life=0;
      } else if((m.target.st==="UP"||m.target.st==="WAIT")&&m.target.wPh!==undefined&&m.target.upDur!==undefined){
        // Pop-up chicken hit
        killPopChick(m.target);birdsHit++;score+=m.target.pt;sndHit();
        pops.push(mkPop(m.target.x,m.target.y-40,"+"+m.target.pt,"#FF8C00"));
        sndExplosion();shake=10;flash=0.2;
        m.life=0;
      }
    }
  }
  if(m.y>H+50||m.y<-50||m.x<-50||m.x>W+50||m.life<=0){
    if(m.life<=0&&m.x>0&&m.x<W&&m.y>0&&m.y<H){sndExplosion();shake=6;}
    m.life=-1;
  }
}
function drwMissile(m){
  c.save();c.translate(m.x,m.y);
  var ang=Math.atan2(m.vy,m.vx);
  c.rotate(ang);
  // body
  c.fillStyle="#666";c.beginPath();c.moveTo(8,0);c.lineTo(-6,-3);c.lineTo(-6,3);c.closePath();c.fill();
  c.fillStyle="#CCC";c.fillRect(-4,-2,6,4);
  // tip
  c.fillStyle="#FF4444";c.beginPath();c.arc(8,0,2,0,Math.PI*2);c.fill();
  // flame
  c.fillStyle="#FF8800";c.beginPath();c.moveTo(-6,-2);c.lineTo(-14,0);c.lineTo(-6,2);c.closePath();c.fill();
  c.fillStyle="#FFCC00";c.beginPath();c.moveTo(-6,-1.5);c.lineTo(-10,0);c.lineTo(-6,1.5);c.closePath();c.fill();
  c.restore();
}

// --- COLOR INTERP ---
function lerpColor(c1,c2,t){
  var r1=parseInt(c1.substr(1,2),16),g1=parseInt(c1.substr(3,2),16),b1=parseInt(c1.substr(5,2),16);
  var r2=parseInt(c2.substr(1,2),16),g2=parseInt(c2.substr(3,2),16),b2=parseInt(c2.substr(5,2),16);
  var r=Math.round(r1+(r2-r1)*t),g=Math.round(g1+(g2-g1)*t),b=Math.round(b1+(b2-b1)*t);
  return"#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

// --- BACKGROUND ---
function drwBg(){
  // Time-of-day sky colors: dawn -> noon -> sunset
  var t=timeOfDay; // 0=dawn, 0.5=noon, 1=sunset
  // Sky gradient stops interpolated
  var skyTop,skyMid,skyLow,skyHorizon;
  if(t<0.5){
    // Dawn to noon
    var k=t/0.5;
    skyTop=lerpColor("#FF9A6B","#4A90C4",k);
    skyMid=lerpColor("#FFC8A0","#87BEDC",k);
    skyLow=lerpColor("#FFE4D0","#C8E0F0",k);
    skyHorizon=lerpColor("#FFD8B0","#F5E6C8",k);
  } else {
    // Noon to sunset
    var k=(t-0.5)/0.5;
    skyTop=lerpColor("#4A90C4","#3A2A5A",k);
    skyMid=lerpColor("#87BEDC","#E87A4A",k);
    skyLow=lerpColor("#C8E0F0","#FFB060",k);
    skyHorizon=lerpColor("#F5E6C8","#FFD040",k);
  }
  var sg=c.createLinearGradient(0,0,0,H*0.7);
  sg.addColorStop(0,skyTop);sg.addColorStop(0.5,skyMid);sg.addColorStop(0.85,skyLow);sg.addColorStop(1,skyHorizon);
  c.fillStyle=sg;c.fillRect(0,0,W,H);
  // Sun position and color based on time
  var sx=W*(0.2+t*0.6),sy=H*(0.25-Math.sin(t*Math.PI)*0.12),sr=45;
  var sunCol=t<0.3?"#FFD0A0":(t<0.7?"#FFF8DC":"#FF8030");
  var sunGlow=t<0.3?"rgba(255,180,120,0.6)":(t<0.7?"rgba(255,240,180,0.6)":"rgba(255,120,50,0.5)");
  var sng=c.createRadialGradient(sx,sy,sr*0.3,sx,sy,sr*3);
  sng.addColorStop(0,sunGlow);sng.addColorStop(0.5,"rgba(255,200,80,0.15)");sng.addColorStop(1,"rgba(255,200,80,0)");
  c.fillStyle=sng;c.beginPath();c.arc(sx,sy,sr*3,0,Math.PI*2);c.fill();
  c.fillStyle=sunCol;c.beginPath();c.arc(sx,sy,sr,0,Math.PI*2);c.fill();
  for(var i=0;i<clouds.length;i++)drwCloud(clouds[i]);
  drwMtn(bgOff*0.15,"#7A8FA6",0.22,H*0.48);
  drwMtn(bgOff*0.3,"#6B8C5A",0.18,H*0.55);
  drwHill(bgOff*0.55,"#5A9E3E",40,0.006,H*0.65);
  drwHill(bgOff*0.8,"#4A8C2F",25,0.01,H*0.72);
  for(var i=0;i<trees.length;i++){var t=trees[i];if(t.ly!==0)continue;var tx=((t.x-bgOff*0.55)%(W+100)+W+100)%(W+100)-50;drwTree(tx,H*0.65-10,t.sz,t.sh);}
  var gg=c.createLinearGradient(0,H*0.72,0,H);
  gg.addColorStop(0,"#4A8C2F");gg.addColorStop(0.3,"#3D7A25");gg.addColorStop(1,"#2D5A1A");
  c.fillStyle=gg;c.fillRect(0,H*0.72,W,H*0.3);
  c.strokeStyle="rgba(0,0,0,0.06)";c.lineWidth=1;
  for(var i=0;i<12;i++){var ly=H*0.74+i*(H*0.25/12);var off=(bgOff*(1.2+i*0.1))%60;c.beginPath();for(var x=-off;x<W+60;x+=60){c.moveTo(x,ly);c.lineTo(x+30,ly);}c.stroke();}
  for(var i=0;i<trees.length;i++){var t=trees[i];if(t.ly!==1)continue;var tx=((t.x-bgOff*0.8)%(W+100)+W+100)%(W+100)-50;drwTree(tx,H*0.72-5,t.sz*1.1,t.sh);}
  c.fillStyle="#2A6B18";var goff=(bgOff*2)%12;
  for(var x=-20;x<W+20;x+=12){var bx=x-goff;var h=8+Math.sin(bx*0.3)*4;c.beginPath();c.moveTo(bx-4,H);c.quadraticCurveTo(bx-2,H*0.92-h,bx,H*0.92-h-5);c.quadraticCurveTo(bx+2,H*0.92-h,bx+4,H);c.fill();}
}
function drwMtn(off,col,hf,by){c.fillStyle=col;c.beginPath();c.moveTo(-10,H);for(var x=-10;x<=W+10;x+=4){var h=H*hf*(0.5+0.3*Math.sin((x+off)*0.005)+0.2*Math.sin((x+off)*0.012+2));c.lineTo(x,by-h);}c.lineTo(W+10,H);c.closePath();c.fill();}
function drwHill(off,col,amp,freq,by){c.fillStyle=col;c.beginPath();c.moveTo(-10,H);for(var x=-10;x<=W+10;x+=4){var y=by-amp*Math.sin((x+off)*freq)-amp*0.4*Math.sin((x+off)*freq*2.5+1.3);c.lineTo(x,y);}c.lineTo(W+10,H);c.closePath();c.fill();}
function drwTree(x,y,sz,sh){

// --- WEATHER ---
function updWeather(dt){
  weatherT-=dt;
  if(weatherT<=0){
    if(weather==="clear"){weather="rain";weatherT=10+Math.random()*8;}
    else if(weather==="rain"){weather="clear";rainbow=1;weatherT=6+Math.random()*4;}
    else weather="clear";
  }
  // Rain intensity ramp
  if(weather==="rain"){rainIntensity=Math.min(1,rainIntensity+dt*0.5);}
  else rainIntensity=Math.max(0,rainIntensity-dt*0.5);
  // Spawn rain drops
  if(rainIntensity>0){
    var n=Math.floor(rainIntensity*8);
    for(var i=0;i<n;i++)rainDrops.push({x:Math.random()*(W+100)-50,y:-10,vy:600+Math.random()*300,vx:-80,life:1});
  }
  // Update rain
  for(var i=0;i<rainDrops.length;i++){
    var r=rainDrops[i];
    r.x+=r.vx*dt;r.y+=r.vy*dt;
    if(r.y>H)rainDrops[i].life=0;
  }
  rainDrops=rainDrops.filter(function(r){return r.life>0;});
  // Rainbow fade
  if(rainbow>0)rainbow=Math.max(0,rainbow-dt*0.15);
}
function drwRain(){
  if(rainIntensity<0.01&&rainbow<0.01)return;
  // Darken sky during rain
  if(rainIntensity>0){
    c.save();c.globalAlpha=rainIntensity*0.3;c.fillStyle="#445566";c.fillRect(0,0,W,H*0.72);c.restore();
  }
  // Rain drops
  c.save();c.strokeStyle="rgba(180,200,230,0.6)";c.lineWidth=1;
  for(var i=0;i<rainDrops.length;i++){
    var r=rainDrops[i];
    c.beginPath();c.moveTo(r.x,r.y);c.lineTo(r.x-3,r.y+12);c.stroke();
  }
  c.restore();
}
function drwRainbow(){
  if(rainbow<0.01)return;
  c.save();c.globalAlpha=rainbow*0.25;
  var cx=W*0.35+Math.sin(rainbow*3)*40,cy=H*0.55,r=H*0.35;
  var cols=["#FF6B6B","#FFA85C","#FFE082","#A5D6A7","#81D4FA","#9575CD","#CE93D8"];
  for(var i=0;i<cols.length;i++){
    c.strokeStyle=cols[i];c.lineWidth=4;
    c.beginPath();c.arc(cx,cy,r-i*5,Math.PI,0);c.stroke();
  }
  c.restore();
}

// --- ROUNDED RECT ---
function rr(x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();}

  if(finalDisp<score){finalDisp+=Math.max(1,Math.ceil((score-finalDisp)*0.08));if(finalDisp>score)finalDisp=score;}
  c.save();c.textAlign="center";
  c.font="bold 56px Arial, sans-serif";c.fillStyle="#FF4444";c.fillText("TIME'S UP!",W/2,H*0.22);
  c.font="bold 24px Arial, sans-serif";c.fillStyle="#AAA";c.fillText("FINAL SCORE",W/2,H*0.31);
  c.font="bold 68px Arial, sans-serif";c.fillStyle="#FFD700";c.fillText(""+finalDisp,W/2,H*0.41);
  var pw=320,ph=190,px=W/2-pw/2,py=H*0.46;
  c.fillStyle="rgba(0,0,0,0.4)";rr(px,py,pw,ph,14);c.fill();
  c.font="bold 20px Arial, sans-serif";
  var acc=shotsFired>0?Math.round(birdsHit/shotsFired*100):0;
  var stats=[["Birds Hit",birdsHit+" / "+totalBirds],["Accuracy",acc+"%"],["Best Combo","x"+bestCombo],["Shots Fired",""+shotsFired],["Weapon",WEAPONS[weapon].toUpperCase()]];
  for(var i=0;i<stats.length;i++){
    var sy=py+30+i*30;
    c.textAlign="left";c.fillStyle="#999";c.fillText(stats[i][0],px+25,sy);
    c.textAlign="right";c.fillStyle="#FFF";c.fillText(stats[i][1],px+pw-25,sy);
  }
  if(goTimer>1){
    var p=0.7+Math.sin(Date.now()*0.005)*0.3;c.globalAlpha=p;
    c.textAlign="center";c.font="bold 28px Arial, sans-serif";c.fillStyle="#FFF";
    c.fillText("CLICK TO PLAY AGAIN",W/2,H*0.90);
  }
  c.restore();
}

// --- SPAWN ---
function spawnBird(){
  var dir=Math.random()<0.5?1:-1;
  var r=Math.random(),elapsed=DURATION-timeLeft,type;
  if(r<0.08)type="golden";
  else if(r<0.08+Math.min(0.3,elapsed/DURATION*0.35))type="fast";
  else if(r<0.38+0.15)type="big";
  else type="normal";
  birds.push(mkBird(type,dir));
  totalBirds++;
}

// --- SHOOT ---
function doShoot(x,y){
  if(overheated){sndEmpty();return;}
  if(reloading){sndEmpty();return;}
  var w=WEAPONS[weapon],maxA=WPN_AMMO[w];
  if(ammo<=0){sndEmpty();startReload();return;}

  if(w==="missile"){
    ammo--;shotsFired++;
    sndMissile();
    // Alternate launch from right/left bottom corner (player perspective)
    var mx2,my2;
    if(missileSide===0){mx2=W*0.95;my2=H*0.95;}
    else{mx2=W*0.05;my2=H*0.95;}
    missileSide=1-missileSide;
    var m=mkMissile(mx2,my2);
    // Initial velocity: angle toward target
    m.target=findNearestTarget(x,y);
    if(m.target){
      sndLock();
      var dx=m.target.x-mx2,dy=m.target.y-my2,d=Math.sqrt(dx*dx+dy*dy)||1;
      m.vx=dx/d*200;m.vy=dy/d*200;
    } else {
      m.vy=-200;
    }
    missiles.push(m);
    shake=3;flash=0.05;chScale=1.3;
    if(ammo<=0)startReload();
    return;
  }

  ammo--;shotsFired++;

  if(w==="mg"){
    sndMG();
    heat+=HEAT_PER_SHOT;
    if(heat>=MAX_HEAT){heat=MAX_HEAT;overheated=true;overheatTimer=OVERHEAT_PENALTY;sndOverheat();}
    shake=2;flash=0.06;chScale=1.25;
    flashes.push(mkFlash(x+(Math.random()-0.5)*6,y+(Math.random()-0.5)*6,true));
    parts.push(mkPart(x-15,y+20,"casing","#D4A030"));
    if(Math.random()<0.3)parts.push(mkPart(x,y,"smoke","rgba(150,150,150,0.4)"));
    var sx=x+(Math.random()-0.5)*16,sy=y+(Math.random()-0.5)*16;
    checkHit(sx,sy);
  } else if(w==="sniper"){
    sndSniper();
    shake=8;flash=0.2;chScale=2.0;
    flashes.push(mkFlash(x,y,false));
    // Sniper: precise, pierces (hits all birds along line)
    for(var i=birds.length-1;i>=0;i--){
      if(hitTest(birds[i],x,y)){killBird(birds[i]);birdsHit++;score+=birds[i].pt+50;combo=0;sndHit();pops.push(mkPop(birds[i].x,birds[i].y-30,"+"+(birds[i].pt+50),"#00FF88"));}
    }
    var ufoHit=null;
    for(var i=ufos.length-1;i>=0;i--){if(hitTestUFO(ufos[i],x,y)){ufoHit=ufos[i];break;}}
    if(ufoHit){killUFO(ufoHit);birdsHit++;score+=ufoHit.pt+50;pops.push(mkPop(ufoHit.x,ufoHit.y-40,"+"+(ufoHit.pt+50),"#00FF88"));}
    var popHit2=null;
    for(var i=popChicks.length-1;i>=0;i--){if(hitTestPopChick(popChicks[i],x,y)){popHit2=popChicks[i];break;}}
    if(popHit2){killPopChick(popHit2);birdsHit++;score+=popHit2.pt+50;combo=0;sndHit();pops.push(mkPop(popHit2.x,popHit2.y-40,"+"+(popHit2.pt+50),"#00FF88"));}
  } else {
    sndShot();
    shake=4;flash=0.12;chScale=1.6;
    flashes.push(mkFlash(x,y,false));
    for(var i=0;i<3;i++)parts.push(mkPart(x,y,"smoke","rgba(180,180,180,0.5)"));
    checkHit(x,y);
  }
  if(ammo<=0)startReload();
}

function checkHit(x,y){
  var hit=null;
  for(var i=birds.length-1;i>=0;i--){if(hitTest(birds[i],x,y)){hit=birds[i];break;}}
  // Check pop-up chickens
  var popHit=null;
  for(var i=popChicks.length-1;i>=0;i--){if(hitTestPopChick(popChicks[i],x,y)){popHit=popChicks[i];break;}}
  // Check UFOs
  var ufoHit=null;
  for(var i=ufos.length-1;i>=0;i--){if(hitTestUFO(ufos[i],x,y)){ufoHit=ufos[i];break;}}
  if(ufoHit){
    killUFO(ufoHit);birdsHit++;
    score+=ufoHit.pt;combo=0;
    pops.push(mkPop(ufoHit.x,ufoHit.y-40,"+"+ufoHit.pt,"#00FFAA"));
  } else if(hit){
    killBird(hit);birdsHit++;
    if(weapon===1){
      score+=hit.pt;
    } else {
      combo=Math.min(combo+1,MAX_COMBO);
      if(combo>bestCombo)bestCombo=combo;
      var pts=hit.pt*combo;score+=pts;
      var pc="#FFD700",pt="+"+pts;if(combo>1)pt+=" x"+combo;
      if(hit.type==="golden")pc="#FFEC8B";else if(hit.type==="fast")pc="#CCC";
      pops.push(mkPop(hit.x,hit.y-30,pt,pc));
    }
    sndHit();shake=weapon===1?3:6;
    if(weapon===1)pops.push(mkPop(hit.x,hit.y-30,"+"+hit.pt,"#FFA500"));
  } else if(popHit){
    killPopChick(popHit);birdsHit++;
    if(weapon===1){score+=popHit.pt;}
    else{
      combo=Math.min(combo+1,MAX_COMBO);
      if(combo>bestCombo)bestCombo=combo;
      var pts=popHit.pt*combo;score+=pts;
      var pt="+"+pts;if(combo>1)pt+=" x"+combo;
      pops.push(mkPop(popHit.x,popHit.y-40,pt,"#FF8C00"));
    }
    sndHit();shake=weapon===1?4:8;
    if(weapon===1)pops.push(mkPop(popHit.x,popHit.y-40,"+"+popHit.pt,"#FFA500"));
  } else {
    if(weapon===0)combo=0;
  }
}

function startReload(){
  if(reloading||overheated)return;
  reloading=true;
  reloadTimer=WPN_RELOAD[WEAPONS[weapon]];
  sndReload();
}

function cycleWeapon(){
  if(state!=="PLAYING")return;
  weapon=(weapon+1)%WEAPONS.length;
  reloading=false;reloadTimer=0;
  overheated=false;overheatTimer=0;heat=0;
  ammo=WPN_AMMO[WEAPONS[weapon]];
  combo=0;fireTimer=0;sniperZoom=0;
  sndToggle();
}

// --- INIT ---
function initGame(){
  score=0;timeLeft=DURATION;ammo=WPN_AMMO[WEAPONS[weapon]];
  reloading=false;reloadTimer=0;combo=0;bestCombo=0;
  shotsFired=0;birdsHit=0;totalBirds=0;
  birds=[];parts=[];pops=[];flashes=[];shellCasings=[];popChicks=[];ufos=[];missiles=[];
  spawnT=0;spawnI=1.8;flash=0;shake=0;goTimer=0;finalDisp=0;
  heat=0;overheated=false;overheatTimer=0;fireTimer=0;mDown=false;
  popSpawnT=6+Math.random()*4;ufoSpawnT=12+Math.random()*8;sniperZoom=0;
  weather="clear";weatherT=15;rainDrops=[];rainbow=0;rainIntensity=0;
  timeOfDay=0;missileSide=0;
}

// --- UPDATE ---
function update(dt){
  menuT+=dt;
  for(var i=0;i<clouds.length;i++)updCloud(clouds[i],dt);

  if(state==="PLAYING"){
    timeLeft-=dt;
    if(timeLeft<=0){timeLeft=0;state="GAMEOVER";goTimer=0;mDown=false;return;}
    bgOff+=30*dt;
    var elapsed=DURATION-timeLeft,df=elapsed/DURATION;
    spawnI=1.8-df*1.1;
    spawnT-=dt;
    if(spawnT<=0){spawnBird();spawnT=spawnI*(0.7+Math.random()*0.6);}

    // MG continuous fire
    if(weapon===1 && mDown && !reloading && !overheated && ammo>0){
      fireTimer-=dt;
      if(fireTimer<=0){doShoot(mx,my);fireTimer=MG_FIRE_RATE;}
    }
    // Sniper zoom
    if(weapon===2){sniperZoom=Math.min(1,sniperZoom+dt*4);}
    else sniperZoom=Math.max(0,sniperZoom-dt*4);
    // MG heat cooldown
    if(weapon===1 && !mDown && !overheated){heat=Math.max(0,heat-HEAT_COOL_RATE*dt);}
    // Overheat penalty
    if(overheated){
      overheatTimer-=dt;
      heat=Math.max(0,heat-HEAT_COOL_RATE*0.5*dt);
      if(overheatTimer<=0){overheated=false;heat=0;}
    }
    // Missiles
    for(var i=0;i<missiles.length;i++)updMissile(missiles[i],dt);
    missiles=missiles.filter(function(m){return m.life>0;});
    // Weather
    updWeather(dt);
    // Time of day: 0->1 over DURATION seconds
    timeOfDay=(DURATION-timeLeft)/DURATION;

    for(var i=0;i<birds.length;i++)updBird(birds[i],dt);
    birds=birds.filter(function(b){return b.st!=="GONE";});
    // Pop-up chickens
    popSpawnT-=dt;
    if(popSpawnT<=0){popChicks.push(mkPopChick());popSpawnT=8+Math.random()*10;}
    for(var i=0;i<popChicks.length;i++)updPopChick(popChicks[i],dt);
    popChicks=popChicks.filter(function(p){return p.st!=="GONE";});
    // UFOs
    ufoSpawnT-=dt;
    if(ufoSpawnT<=0&&ufos.length<2){var u=mkUFO();u.baseY=u.y;ufos.push(u);ufoSpawnT=15+Math.random()*15;}
    for(var i=0;i<ufos.length;i++)updUFO(ufos[i],dt);
    ufos=ufos.filter(function(u){return u.st!=="GONE";});
    if(reloading){
      reloadTimer-=dt;
      if(reloadTimer<=0){reloading=false;ammo=WPN_AMMO[WEAPONS[weapon]];sndReload();}
    }
  } else if(state==="MENU"){bgOff+=20*dt;}
  else if(state==="GAMEOVER"){bgOff+=10*dt;goTimer+=dt;for(var i=0;i<birds.length;i++)updBird(birds[i],dt);birds=birds.filter(function(b){return b.st!=="GONE";});for(var i=0;i<popChicks.length;i++)updPopChick(popChicks[i],dt);popChicks=popChicks.filter(function(p){return p.st!=="GONE";});for(var i=0;i<ufos.length;i++)updUFO(ufos[i],dt);ufos=ufos.filter(function(u){return u.st!=="GONE";});}

  for(var i=0;i<parts.length;i++)updPart(parts[i],dt);parts=parts.filter(function(p){return p.life>0;});
  for(var i=0;i<pops.length;i++)updPop(pops[i],dt);pops=pops.filter(function(p){return p.life>0;});
  for(var i=0;i<flashes.length;i++)updFlash(flashes[i],dt);flashes=flashes.filter(function(f){return f.life>0;});
  shake*=0.85;if(shake<0.1)shake=0;shX=(Math.random()-0.5)*shake*2;shY=(Math.random()-0.5)*shake*2;
  chScale+=(1-chScale)*0.15;
  flash*=0.82;if(flash<0.005)flash=0;
}

// --- DRAW ---
function draw(){
  c.clearRect(0,0,W,H);
  if(state==="MENU"){drwMenu();drwCH();}
  else if(state==="PLAYING"){
    c.save();c.translate(shX,shY);drwBg();
    birds.sort(function(a,b){return a.y-b.y;});
    for(var i=0;i<birds.length;i++)drwBird(birds[i]);
    for(var i=0;i<popChicks.length;i++)drwPopChick(popChicks[i]);
    for(var i=0;i<ufos.length;i++)drwUFO(ufos[i]);
    for(var i=0;i<missiles.length;i++)drwMissile(missiles[i]);
    for(var i=0;i<parts.length;i++)drwPart(parts[i]);
    for(var i=0;i<flashes.length;i++)drwFlash(flashes[i]);
    for(var i=0;i<pops.length;i++)drwPop(pops[i]);
    c.restore();
    drwRain();drwRainbow();
    if(flash>0){c.fillStyle="rgba(255,255,255,"+flash+")";c.fillRect(0,0,W,H);}
    if(sniperZoom>0.01)drwScope();
    drwHUD();drwCH();
  }
  else if(state==="GAMEOVER"){drwGO();drwCH();}
}

// --- LOOP ---
var lastT=0;
function loop(t){
  var dt=Math.min((t-lastT)/1000,0.05);lastT=t;
  try{update(dt);draw();}catch(e){c.fillStyle="#ff0000";c.fillRect(0,0,W,H);c.fillStyle="#fff";c.font="16px monospace";c.fillText("RUNTIME ERROR: "+e.message,20,30);}
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// --- INPUT ---
cv.addEventListener("mousemove",function(e){mx=e.clientX;my=e.clientY;});

cv.addEventListener("mousedown",function(e){
  if(e.button!==0)return;
  try{aud();}catch(e){}
  mDown=true;
  if(state==="MENU"){state="PLAYING";initGame();}
  else if(state==="PLAYING"){
    if(isOnModeBtn(e.clientX,e.clientY)){cycleWeapon();mDown=false;return;}
    if(weapon===1){fireTimer=0;doShoot(e.clientX,e.clientY);fireTimer=MG_FIRE_RATE;}
    else doShoot(e.clientX,e.clientY);
  }
  else if(state==="GAMEOVER"&&goTimer>1){state="PLAYING";initGame();}
});

cv.addEventListener("mouseup",function(e){if(e.button===0)mDown=false;});
cv.addEventListener("mouseleave",function(){mDown=false;});

cv.addEventListener("touchstart",function(e){
  e.preventDefault();try{aud();}catch(e){}
  var t=e.touches[0];mx=t.clientX;my=t.clientY;mDown=true;
  if(state==="MENU"){state="PLAYING";initGame();}
  else if(state==="PLAYING"){
    if(isOnModeBtn(t.clientX,t.clientY)){cycleWeapon();mDown=false;return;}
    if(weapon===1){fireTimer=0;doShoot(t.clientX,t.clientY);fireTimer=MG_FIRE_RATE;}
    else doShoot(t.clientX,t.clientY);
  }
  else if(state==="GAMEOVER"&&goTimer>1){state="PLAYING";initGame();}
},{passive:false});

cv.addEventListener("touchmove",function(e){e.preventDefault();var t=e.touches[0];mx=t.clientX;my=t.clientY;},{passive:false});
cv.addEventListener("touchend",function(e){e.preventDefault();mDown=false;},{passive:false});
cv.addEventListener("touchcancel",function(){mDown=false;});

window.addEventListener("keydown",function(e){
  if((e.key==="r"||e.key==="R")&&state==="PLAYING"&&!reloading&&!overheated&&ammo<WPN_AMMO[WEAPONS[weapon]])startReload();
  if((e.key==="m"||e.key==="M")&&state==="PLAYING")cycleWeapon();
});
cv.addEventListener("contextmenu",function(e){e.preventDefault();});
</script>
